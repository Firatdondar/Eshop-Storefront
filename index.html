<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Professional E-Commerce Web Interface">
    <title>E-Commerce | Home</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">E-Shop</div>
        <nav class="nav-links">
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
        <button class="cart-btn" id="cartBtn">Cart (<span id="cartCount">0</span>)</button>
    </header>

    <main>
        <section id="home" class="hero-section">
            <h1>Welcome to Our Store</h1>
            <p>Find the best products at the most affordable prices.</p>
            <button class="cta-btn">Shop Now</button>
        </section>

        <section id="products" class="products-section">
            <h2>Featured Products</h2>
            <div class="product-grid">
                <div class="product-card">
                    <div class="product-placeholder">Image</div>
                    <h3>Smartphone</h3>
                    <p class="price">$599.99</p>
                    <button class="add-to-cart-btn" onclick="addToCart()">Add to Cart</button>
                </div>
                <div class="product-card">
                    <div class="product-placeholder">Image</div>
                    <h3>Laptop</h3>
                    <p class="price">$999.99</p>
                    <button class="add-to-cart-btn" onclick="addToCart()">Add to Cart</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 E-Shop. All rights reserved.</p>
    </footer>

    <script src="assets/js/script.js"></script>
</body>
</html>
